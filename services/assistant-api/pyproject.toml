[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-api"
version = "0.1.0"
description = "Personal Assistant backend: business data, local identity, NexusPilot client"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "h2>=4.1",
  "icalendar>=6,<7",
  "PyJWT[crypto]>=2.8",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
